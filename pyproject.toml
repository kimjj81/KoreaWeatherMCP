[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "korea-weather-mcp"
version = "0.1.0"
description = "기상청 중기예보 조회 MCP 서버"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Korea Weather MCP"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.103.1",
    "uvicorn>=0.22.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "mcp>=0.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.0.0"
]

[project.urls]
"Homepage" = "https://github.com/kimjj81/KoreaWeatherMCP"
"Bug Tracker" = "https://github.com/kimjj81/KoreaWeatherMCP/issues"

[project.scripts]
korea-weather-mcp = "korea_weather.__main__:main"

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310"]

[tool.isort]
profile = "black"
line_length = 88 